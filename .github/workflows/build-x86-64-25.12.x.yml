name: build-x86-64-immortalwrt-25.12.x
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.0"
        type: choice
        options:
          - 25.12.0-rc1
          - 25.12.0-rc2
          - 25.12.0
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '请输入要编译固件大小 单位(MB)'
        required: true
        default: '1024'
      enable_store:
        description: "集成 iStore 商店 (apk版)"
        required: false
        type: boolean
        default: true
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_info:
        description: "PPPoE账号:密码 (格式: 账号冒号密码 例: user@123456:pass123)"
        required: false
      # ============= 插件预设 =============
      # 重要: 选择预设方案时,预设会覆盖下方所有复选框,无需手动勾选
      # 只有选择"自定义"时,下方复选框才生效
      preset:
        description: "插件预设方案 (选自定义时下方复选框才生效,选其他预设则自动编译对应插件)"
        required: true
        default: "自定义"
        type: choice
        options:
          - 自定义
          - 精简版
          - 标准版
          - 全家桶
      # ============= 代理工具 =============
      enable_passwall:
        description: "【代理】PassWall (经典版 含xray/singbox/ss/ssr/trojan)"
        required: false
        type: boolean
        default: false
      enable_passwall2:
        description: "【代理】PassWall2 (新版 含xray/sing-box/hysteria)"
        required: false
        type: boolean
        default: false
      enable_openclash:
        description: "【代理】OpenClash (含clash_meta内核 体积较大)"
        required: false
        type: boolean
        default: false
      enable_ssr_plus:
        description: "【代理】SSR-Plus (含mihomo内核)"
        required: false
        type: boolean
        default: false
      enable_nikki:
        description: "【代理】Nikki 代理工具"
        required: false
        type: boolean
        default: false
      enable_clashoo:
        description: "【代理】Clashoo 代理插件"
        required: false
        type: boolean
        default: false
      # ============= DNS/去广告 (仅自定义模式生效) =============
      enable_mosdns:
        description: "【DNS】MosDNS 高性能DNS分流"
        required: false
        type: boolean
        default: false
      enable_adguardhome:
        description: "【去广告】AdGuardHome 本地DNS去广告"
        required: false
        type: boolean
        default: false
      # ============= 网络/加速/组网 (仅自定义模式生效) =============
      enable_turboacc:
        description: "【加速】TurboACC 网络加速 (含BBR/shortcut)"
        required: false
        type: boolean
        default: false
      enable_tailscale:
        description: "【组网】Tailscale VPN (基于WireGuard)"
        required: false
        type: boolean
        default: false
      enable_easytier:
        description: "【组网】Easytier 组网工具"
        required: false
        type: boolean
        default: false
      # ============= 主题 (仅自定义模式生效) =============
      enable_aurora:
        description: "【主题】极光主题 Aurora Theme"
        required: false
        type: boolean
        default: true
      # ============= 实用工具 (仅自定义模式生效) =============
      enable_lucky:
        description: "【工具】Lucky大吉 (端口转发/反向代理/NAT)"
        required: false
        type: boolean
        default: false
      enable_quickfile:
        description: "【工具】QuickFile 文件管理器"
        required: false
        type: boolean
        default: true
      enable_uninstall:
        description: "【工具】高级卸载 (彻底删除插件)"
        required: false
        type: boolean
        default: false
      enable_partexp:
        description: "【工具】分区扩容 (扩展固件空间)"
        required: false
        type: boolean
        default: false
      enable_bandix:
        description: "【工具】Bandix 流量监控"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ github.event.inputs.custom_router_ip }}"

      - name: Configure plugin selections
        run: |
          # ============= 解析预设方案 vs 自定义选择 =============
          # 选择非"自定义"预设时,预设覆盖所有复选框
          # 只有选择"自定义"时,复选框的勾选状态才生效
          if [ "${{ inputs.preset }}" != "自定义" ]; then
            case "${{ inputs.preset }}" in
              精简版)
                PASSWALL=false; PASSWALL2=false; OPENCLASH=false; SSR_PLUS=false
                NIKKI=false; CLASHOO=false; MOSDNS=false; ADGUARDHOME=false
                TURBOACC=false; TAILSCALE=false; EASYTIER=false
                AURORA=true; LUCKY=false; QUICKFILE=true; UNINSTALL=true
                PARTEXP=false; BANDIX=false
                ;;
              标准版)
                PASSWALL=true; PASSWALL2=false; OPENCLASH=false; SSR_PLUS=false
                NIKKI=false; CLASHOO=false; MOSDNS=true; ADGUARDHOME=false
                TURBOACC=true; TAILSCALE=false; EASYTIER=false
                AURORA=true; LUCKY=false; QUICKFILE=true; UNINSTALL=true
                PARTEXP=true; BANDIX=false
                ;;
              全家桶)
                PASSWALL=true; PASSWALL2=true; OPENCLASH=true; SSR_PLUS=true
                NIKKI=true; CLASHOO=true; MOSDNS=true; ADGUARDHOME=true
                TURBOACC=true; TAILSCALE=true; EASYTIER=true
                AURORA=true; LUCKY=true; QUICKFILE=true; UNINSTALL=true
                PARTEXP=true; BANDIX=true
                ;;
            esac
          else
            PASSWALL="${{ inputs.enable_passwall }}"
            PASSWALL2="${{ inputs.enable_passwall2 }}"
            OPENCLASH="${{ inputs.enable_openclash }}"
            SSR_PLUS="${{ inputs.enable_ssr_plus }}"
            NIKKI="${{ inputs.enable_nikki }}"
            CLASHOO="${{ inputs.enable_clashoo }}"
            MOSDNS="${{ inputs.enable_mosdns }}"
            ADGUARDHOME="${{ inputs.enable_adguardhome }}"
            TURBOACC="${{ inputs.enable_turboacc }}"
            TAILSCALE="${{ inputs.enable_tailscale }}"
            EASYTIER="${{ inputs.enable_easytier }}"
            AURORA="${{ inputs.enable_aurora }}"
            LUCKY="${{ inputs.enable_lucky }}"
            QUICKFILE="${{ inputs.enable_quickfile }}"
            UNINSTALL="${{ inputs.enable_uninstall }}"
            PARTEXP="${{ inputs.enable_partexp }}"
            BANDIX="${{ inputs.enable_bandix }}"
          fi

          echo "========================================="
          echo "  插件选择结果 (方案: ${{ inputs.preset }})"
          echo "========================================="
          echo "PassWall:      $PASSWALL"
          echo "PassWall2:     $PASSWALL2"
          echo "OpenClash:     $OPENCLASH"
          echo "SSR-Plus:      $SSR_PLUS"
          echo "Nikki:         $NIKKI"
          echo "Clashoo:       $CLASHOO"
          echo "MosDNS:        $MOSDNS"
          echo "AdGuardHome:   $ADGUARDHOME"
          echo "TurboACC:      $TURBOACC"
          echo "Tailscale:     $TAILSCALE"
          echo "Easytier:      $EASYTIER"
          echo "极光主题:       $AURORA"
          echo "Lucky大吉:     $LUCKY"
          echo "QuickFile:     $QUICKFILE"
          echo "高级卸载:       $UNINSTALL"
          echo "分区扩容:       $PARTEXP"
          echo "Bandix监控:    $BANDIX"
          echo "========================================="

          # ============= 动态生成 shell/apk-custom-packages.sh =============
          cat > shell/apk-custom-packages.sh << 'SHEOF'
          #!/bin/bash
          # ============= 由 GitHub Actions 工作流自动生成 (25.12.x apk版) =============
          SHEOF

          if [ "$PASSWALL" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-passwall luci-i18n-passwall-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$PASSWALL2" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES xray-core sing-box hysteria kmod-nft-socket kmod-nft-tproxy luci-app-passwall2 luci-i18n-passwall2-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$OPENCLASH" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-openclash"' >> shell/apk-custom-packages.sh
          fi
          if [ "$SSR_PLUS" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES xray-core naiveproxy luci-app-ssr-plus luci-i18n-ssr-plus-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$NIKKI" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-nikki luci-i18n-nikki-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$CLASHOO" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES clashoo luci-app-clashoo luci-i18n-clashoo-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$MOSDNS" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-mosdns luci-i18n-mosdns-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$ADGUARDHOME" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-adguardhome"' >> shell/apk-custom-packages.sh
          fi
          if [ "$TURBOACC" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-turboacc"' >> shell/apk-custom-packages.sh
          fi
          if [ "$TAILSCALE" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$EASYTIER" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES easytier luci-app-easytier"' >> shell/apk-custom-packages.sh
          fi
          if [ "$AURORA" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-theme-aurora luci-app-aurora-config luci-i18n-aurora-config-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$LUCKY" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-lucky lucky luci-i18n-lucky-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$QUICKFILE" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES bash quickfile luci-app-quickfile luci-i18n-quickfile-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$UNINSTALL" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-uninstall"' >> shell/apk-custom-packages.sh
          fi
          if [ "$PARTEXP" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-partexp luci-i18n-partexp-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "$BANDIX" = "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES bandix luci-app-bandix luci-i18n-bandix-zh-cn"' >> shell/apk-custom-packages.sh
          fi
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
          fi

          echo "✅ 自定义插件配置已生成 (25.12.x apk版)"
          cat shell/apk-custom-packages.sh

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"

          # 解析PPPoE账号密码 (格式: 账号:密码)
          pppoe_info="${{ github.event.inputs.pppoe_info }}"
          if [ -n "$pppoe_info" ] && [[ "$pppoe_info" == *:* ]]; then
            PPPOE_ACCOUNT="${pppoe_info%%:*}"
            PPPOE_PASSWORD="${pppoe_info#*:}"
            ENABLE_PPPOE="yes"
            echo "PPPoE已配置: 账号=$PPPOE_ACCOUNT"
          else
            ENABLE_PPPOE="no"
            PPPOE_ACCOUNT=""
            PPPOE_PASSWORD=""
          fi

          echo "Building for profile: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=$ENABLE_PPPOE \
            -e PPPOE_ACCOUNT=$PPPOE_ACCOUNT \
            -e PPPOE_PASSWORD=$PPPOE_PASSWORD \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - **用户名**: root
          - **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
