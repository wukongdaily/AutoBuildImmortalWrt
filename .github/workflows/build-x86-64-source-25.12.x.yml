name: build-x86-64-immortalwrt-25.12.x-source

# 与 ImageBuilder 版工作流相比，本工作流使用完整源码编译，
# 可修改内核 Kconfig，从而启用 MLX5 硬件分流所需的内核选项。
# 编译耗时约 60-120 分钟（GitHub Actions ubuntu-22.04 双核）。

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 ImmortalWrt 源码分支"
        required: false
        default: "openwrt-25.12"
        type: choice
        options:
          - openwrt-25.12
          - main
      custom_router_ip:
        description: "路由器管理地址（多网口有效）格式: 192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.2.254"
      profile:
        description: "根分区大小 单位(MB)"
        required: true
        default: "2048"
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否配置 PPPoE 拨号"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "PPPoE 账号（启用 PPPoE 时填写）"
        required: false
      pppoe_password:
        description: "PPPoE 密码（启用 PPPoE 时填写）"
        required: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  WORKDIR: /workdir/immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ── 0. 检出本仓库 ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. 校验 PPPoE 输入 ───────────────────────────────────
      - name: Validate PPPoE inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      # ── 2. 释放磁盘空间（OpenWrt 源码编译需要 ~20 GB） ───────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift /opt/ghc
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get -y purge \
            azure-cli* docker* ghc* zulu* llvm* firefox \
            google-chrome* dotnet* aspnetcore* powershell* \
            openjdk* mongodb* moby* snapd* 2>/dev/null || true
          sudo apt-get autoremove -y && sudo apt-get clean
          df -h

      # ── 3. 安装编译依赖 ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget libelf-dev \
            ccache jq qemu-utils
          sudo timedatectl set-timezone "$TZ"

      # ── 4. 克隆 ImmortalWrt 源码 ─────────────────────────────
      - name: Clone ImmortalWrt source
        run: |
          sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir
          git clone --depth=1 \
            -b ${{ github.event.inputs.luci_version }} \
            ${{ env.REPO_URL }} ${{ env.WORKDIR }}
          df -h

      # ── 5. 更新并安装 feeds ──────────────────────────────────
      - name: Update and install feeds
        working-directory: ${{ env.WORKDIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ── 6. 应用 seed config + 动态注入分区大小 ──────────────
      - name: Apply seed config
        run: |
          cp ${{ github.workspace }}/x86-64/seed-source25.config \
            ${{ env.WORKDIR }}/.config
          # 根分区大小（对应 ImageBuilder 的 ROOTFS_PARTSIZE 参数）
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.profile }}" \
            >> ${{ env.WORKDIR }}/.config
          # Docker 插件（条件注入）
          if [[ "${{ github.event.inputs.include_docker }}" == "yes" ]]; then
            echo "CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y" \
              >> ${{ env.WORKDIR }}/.config
          fi
          cd ${{ env.WORKDIR }} && make defconfig

      # ── 7. 关键：向内核 Kconfig 注入 MLX5 硬件分流所需选项 ──
      #
      #  CONFIG_MLX5_CORE_EN    — mlx5e 以太网层，hw-tc-offload 的前提
      #  CONFIG_MLX5_ESWITCH    — eSwitch，TC offload 规则下发通道
      #  CONFIG_NET_TC_SKB_EXT  — TC SKB 元数据扩展，offload 数据传递
      #  CONFIG_MLX5_TC_CT      — mlx5 连接跟踪硬件卸载
      #  CONFIG_NET_ACT_CT      — 通用 TC act_ct 模块
      #  CONFIG_NET_CLS_FLOWER  — TC flower 分类器（hw offload 入口）
      #  CONFIG_NET_CLS_ACT     — TC action 框架（内核内置）
      #  CONFIG_NET_INGRESS     — TC ingress 钩子
      # ─────────────────────────────────────────────────────────
      - name: Patch kernel config for MLX5 hardware offload
        run: |
          KCONF="${{ env.WORKDIR }}/target/linux/x86/config-6.12"

          set_kconfig() {
            local key="$1" val="$2"
            if grep -qE "^(# )?${key}[= ]" "$KCONF" 2>/dev/null; then
              sed -i \
                -e "s|^# ${key} is not set|${key}=${val}|" \
                -e "s|^${key}=.*|${key}=${val}|" \
                "$KCONF"
            else
              echo "${key}=${val}" >> "$KCONF"
            fi
          }

          set_kconfig CONFIG_MLX5_CORE_EN       y
          set_kconfig CONFIG_MLX5_ESWITCH       y
          set_kconfig CONFIG_NET_TC_SKB_EXT     y
          set_kconfig CONFIG_MLX5_TC_CT         y
          set_kconfig CONFIG_NET_ACT_CT         m
          set_kconfig CONFIG_NET_CLS_FLOWER     m
          set_kconfig CONFIG_NET_CLS_ACT        y
          set_kconfig CONFIG_NET_INGRESS        m

          echo "=== 已注入的内核选项 ==="
          grep -E "MLX5|TC_SKB_EXT|NET_ACT_CT|NET_CLS_FLOWER|NET_INGRESS|NET_CLS_ACT" \
            "$KCONF"

      # ── 8. 准备 files 目录（99-custom.sh / pppoe-settings 等）─
      - name: Prepare firmware files overlay
        run: |
          # 复制本仓库 files/ 目录（含 99-custom.sh）
          cp -r ${{ github.workspace }}/files \
            ${{ env.WORKDIR }}/files

          # 路由器管理 IP（多网口设备使用）
          mkdir -p ${{ env.WORKDIR }}/files/etc/config
          echo "${{ github.event.inputs.custom_router_ip }}" \
            > ${{ env.WORKDIR }}/files/etc/config/custom_router_ip.txt

          # PPPoE 配置（与原 ImageBuilder 版保持一致，供 99-custom.sh 读取）
          cat > ${{ env.WORKDIR }}/files/etc/config/pppoe-settings << EOF
          enable_pppoe=${{ inputs.enable_pppoe }}
          pppoe_account=${{ inputs.pppoe_account }}
          pppoe_password=${{ inputs.pppoe_password }}
          EOF

      # ── 9. 下载 OpenClash 核心 & GeoIP/GeoSite ───────────────
      - name: Download OpenClash core
        run: |
          mkdir -p ${{ env.WORKDIR }}/files/etc/openclash/core
          META_URL="https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64-v1.tar.gz"
          wget -qO- "$META_URL" | tar xOvz \
            > ${{ env.WORKDIR }}/files/etc/openclash/core/clash_meta
          chmod +x ${{ env.WORKDIR }}/files/etc/openclash/core/clash_meta
          wget -q "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" \
            -O ${{ env.WORKDIR }}/files/etc/openclash/GeoIP.dat
          wget -q "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" \
            -O ${{ env.WORKDIR }}/files/etc/openclash/GeoSite.dat

      # ── 10. 预下载源码包（并发 8，删除不完整小文件） ─────────
      - name: Download package sources
        working-directory: ${{ env.WORKDIR }}
        run: |
          make download -j8 2>&1 | tee /tmp/download.log || true
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true
          df -h

      # ── 11. 编译固件（失败自动回退单线程详细日志） ───────────
      - name: Compile firmware
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "Starting compilation with $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s
          echo "Compilation finished."
          df -h

      # ── 12. 整理产物（只保留 EFI squashfs） ─────────────────
      - name: Organize output files
        run: |
          OUTPUT="${{ env.WORKDIR }}/bin/targets/x86/64"
          ls -lh "$OUTPUT"
          echo "OUTPUT_DIR=$OUTPUT" >> $GITHUB_ENV

      # ── 13. 生成 Release 说明 ────────────────────────────────
      - name: Create release notes
        run: |
          cat > ${{ github.workspace }}/router-info.md << EOF
          ## 📡 ImmortalWrt x86-64 源码编译版（MLX5 硬件分流）
          <a href="https://wkdaily.cpolar.cn/archives/1">
            <img src="https://img.shields.io/badge/国内加速下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>

          | 项目 | 值 |
          |------|-----|
          | 🏠 后台地址 | ${{ github.event.inputs.custom_router_ip }} |
          | 👤 用户名 | root |
          | 🔑 密码 | 无 |
          | 🐳 Docker | ${{ github.event.inputs.include_docker }} |
          | 💾 根分区 | ${{ github.event.inputs.profile }} MB |

          ### 内核特性（相比 ImageBuilder 版新增）
          - ✅ \`CONFIG_MLX5_CORE_EN\` — mlx5e 以太网层 + hw-tc-offload 入口
          - ✅ \`CONFIG_MLX5_ESWITCH\` — eSwitch TC 规则下发通道
          - ✅ \`CONFIG_NET_TC_SKB_EXT\` — TC SKB 元数据扩展
          - ✅ \`CONFIG_MLX5_TC_CT\` — mlx5 连接跟踪硬件卸载
          - ✅ \`kmod-sched-flower\` / \`kmod-sched-act-ct\` — TC flower 分类器 & CT action
          EOF

          if [[ "${{ github.event.inputs.include_docker }}" == "yes" ]]; then
            echo -e "\n#### 默认包含 Docker" >> ${{ github.workspace }}/router-info.md
          fi

      # ── 14. 上传到 Release ───────────────────────────────────
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Autobuild-x86-64-source
          body_path: ${{ github.workspace }}/router-info.md
          files: ${{ env.OUTPUT_DIR }}/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
